# Compiles the Mac app's icon for macOS 26 (Liquid Glass) on a Mac with Xcode 26 - the Mac at home has only the
# Command Line Tools, and actool comes with Xcode. Input: macos-icon/docpad.icon (a copy of DOCPAD's app/docpad.icon:
# the D as a flat layer, every glass effect off - Doc 06.10.2026: "warum ist das D unten so fuzzy?"); output: the
# artifact docpad-mac-icon with Assets.car (into the app's Resources, Info.plist CFBundleIconName = docpad).
name: macos-icon
on:
  push:
    branches: [main]
    paths: ['macos-icon/**', '.github/workflows/macos-icon.yml']
  workflow_dispatch:
jobs:
  icon:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: variants
        # which keys this Xcode's actool takes: from the plainest icon.json up to the full one, each compiled on its own
        run: |
          python3 - <<'PY'
          import json, os, shutil, subprocess
          base = json.load(open('macos-icon/docpad.icon/icon.json'))
          layer = {"image-name": "d.svg", "name": "D"}
          steps = [
            ("A plain", {}, {}),
            ("B layer glass off", {"glass": False}, {}),
            ("C + specular off", {"glass": False}, {"specular": False}),
            ("D + shadow, translucency off", {"glass": False}, {"specular": False, "shadow": {"kind": "none", "opacity": 0}, "translucency": {"enabled": False, "value": 0}}),
            ("E + blur-material 0", {"glass": False}, {"specular": False, "shadow": {"kind": "none", "opacity": 0}, "translucency": {"enabled": False, "value": 0}, "blur-material": 0}),
          ]
          for name, lay, grp in steps:
              d = 'v/' + name.split()[0] + '/docpad.icon'
              shutil.copytree('macos-icon/docpad.icon/Assets', d + '/Assets')
              j = {"fill": base["fill"], "groups": [dict({"layers": [dict(layer, **lay)]}, **grp)], "supported-platforms": {"squares": "shared"}}
              json.dump(j, open(d + '/icon.json', 'w'), indent=2)
              out = 'v/' + name.split()[0] + '/out'; os.makedirs(out)
              r = subprocess.run(['xcrun', 'actool', d, '--compile', out, '--output-format', 'human-readable-text', '--errors',
                '--output-partial-info-plist', out + '/partial.plist', '--app-icon', 'docpad', '--include-all-app-icons',
                '--enable-on-demand-resources', 'NO', '--development-region', 'en', '--target-device', 'mac',
                '--minimum-deployment-target', '26.0', '--platform', 'macosx'], capture_output=True, text=True)
              ok = os.path.exists(out + '/Assets.car')
              print('VARIANT', name, '->', 'OK' if ok else 'FAIL', (r.stdout + r.stderr).strip().splitlines()[:2] if not ok else '')
          PY
          ls -la v/*/out
      - uses: actions/upload-artifact@v4
        with:
          name: docpad-mac-icon
          path: v/
